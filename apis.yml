name: Terra AI
description: >-
  Terra AI is a geoscience frontier company building specialized artificial
  intelligence for the natural resources sector, focused on subsurface
  characterization and exploration optimization for mining and reservoir
  operators. Its platform integrates exploration data to generate large
  populations of geological models, helping teams decide where to drill,
  characterize deposits, and assess project economics earlier — the company
  cites 50-60% fewer drilling meters and 2-3x more precise resource estimates
  versus conventional methods. Terra AI raised a $20M Series A led by Khosla
  Ventures with BHP Ventures in June 2026 and serves copper, gold, rare-earth
  (REE), and reservoir projects. The company operates on a B2B model and
  publishes no public developer API, SDK, or developer portal at this time.
